<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <title>Arquitetura do Bovinu's Connect</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a8478"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="20" fill="#fffdf9"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#2a1a16">Um processo Python atende todos os dispositivos</text>
  <text x="40" y="78" font-size="14" fill="#6b5a52">Rede local · sem serviços externos · navegador como cliente</text>

  <g font-size="14" fill="#2a1a16">
    <text x="40" y="118" font-size="12" font-weight="700" fill="#9a8478" letter-spacing="1.5">CLIENTE</text>
    <rect x="40" y="128" width="220" height="44" rx="10" fill="#fff" stroke="#e5d8cc"/>
    <text x="56" y="155">📱 Celular do cliente</text>
    <text x="40" y="206" font-size="12" font-weight="700" fill="#9a8478" letter-spacing="1.5">EQUIPE</text>
    <rect x="40" y="216" width="220" height="44" rx="10" fill="#fff" stroke="#e5d8cc"/>
    <text x="56" y="243">🚪 Totem de entrada</text>
    <rect x="40" y="268" width="220" height="44" rx="10" fill="#fff" stroke="#e5d8cc"/>
    <text x="56" y="295">⚖️ Balança</text>
    <rect x="40" y="320" width="220" height="44" rx="10" fill="#fff" stroke="#e5d8cc"/>
    <text x="56" y="347">💳 Caixa</text>
    <text x="40" y="398" font-size="12" font-weight="700" fill="#9a8478" letter-spacing="1.5">GESTÃO</text>
    <rect x="40" y="408" width="220" height="44" rx="10" fill="#fff" stroke="#e5d8cc"/>
    <text x="56" y="435">💻 Notebook do gerente</text>
    <rect x="40" y="460" width="220" height="44" rx="10" fill="#fff" stroke="#e5d8cc"/>
    <text x="56" y="487">📺 TVs Cozinha e Salão</text>
  </g>

  <g stroke="#9a8478" stroke-width="1.6" fill="none">
    <path d="M260 150H330V320"/><path d="M260 238H330"/><path d="M260 290H330"/><path d="M260 342H330"/>
    <path d="M260 430H330V320"/><path d="M260 482H330V430"/>
    <path d="M330 300H396" marker-end="url(#seta)"/>
  </g>
  <text x="338" y="288" font-size="12" fill="#6b5a52">HTTP</text>

  <rect x="400" y="200" width="300" height="200" rx="16" fill="#7b1c20"/>
  <text x="424" y="240" font-size="20" font-weight="700" fill="#fff">app.py</text>
  <text x="424" y="264" font-size="13" fill="#f3d9b5">Python · biblioteca padrão</text>
  <g font-size="13" fill="#fff">
    <text x="424" y="298">• Páginas HTML/CSS/JS</text>
    <text x="424" y="322">• API REST (JSON)</text>
    <text x="424" y="346">• Login com papéis e sessão</text>
    <text x="424" y="370">• Indicadores e CSV</text>
  </g>

  <path d="M700 300H776" stroke="#9a8478" stroke-width="1.6" fill="none" marker-end="url(#seta)"/>
  <text x="712" y="288" font-size="12" fill="#6b5a52">sqlite3</text>
  <g>
    <ellipse cx="850" cy="248" rx="70" ry="16" fill="#d4952b"/>
    <path d="M780 248V352A70 16 0 0 0 920 352V248" fill="#e7b25a"/>
    <ellipse cx="850" cy="352" rx="70" ry="16" fill="#d4952b" opacity="0"/>
    <ellipse cx="850" cy="248" rx="70" ry="16" fill="#f0c879"/>
    <text x="850" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#2a1a16">SQLite</text>
    <text x="850" y="326" text-anchor="middle" font-size="12" fill="#2a1a16">bovinus.db</text>
  </g>
  <text x="780" y="400" font-size="12" fill="#6b5a52">schema.sql + views</text>
  <text x="780" y="418" font-size="12" fill="#6b5a52">jornada e fidelidade</text>
</svg>
