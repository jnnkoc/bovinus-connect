<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7d1d1f">
<title>Entrar · Equipe Bovinu's Connect</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/estilo.css">
<style>
body { background: var(--bordo); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
.caixa-login { background: var(--papel); border-radius: 22px; padding: 2rem 1.75rem; width: min(420px, 100%);
               box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.caixa-login .logo { display: block; margin: 0 auto 1rem; }
</style>
</head>
<body>
<main class="caixa-login pilha">
  <span class="logo grande"><img src="/img/logo.png" alt="Bovinu's Grill & Beer"></span>
  <h1 class="centro">Área da equipe</h1>
  <p class="centro mudo">Terminal, cardápio do dia e dashboard.</p>
  <p class="alerta alerta-aviso" id="negado" hidden>Seu usuário não tem acesso a essa tela. Entre com outro usuário.</p>
  <form id="form" class="pilha" novalidate>
    <div class="campo"><label for="login">Usuário</label>
      <input id="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
    <div class="campo"><label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required></div>
    <p id="erro" class="alerta alerta-erro" role="alert" hidden></p>
    <button class="btn btn-primario btn-grande btn-bloco" id="entrar">Entrar</button>
  </form>
  <p class="centro pequeno"><a href="/">← Voltar ao app do cliente</a></p>
</main>
<script src="/comum.js"></script>
<script>
const parametros = new URLSearchParams(location.search);
document.getElementById('negado').hidden = !parametros.has('negado');
// Só aceita voltar para um caminho deste site.
function destino(papel) {
  const volta = parametros.get('volta') || '';
  if (volta.startsWith('/') && !volta.startsWith('//') && !volta.startsWith('/\\') && !volta.startsWith('/login')) return volta;
  return papel === 'gerente' ? '/dashboard' : '/terminal';
}
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const erro = document.getElementById('erro');
  const botao = document.getElementById('entrar');
  const login = document.getElementById('login').value.trim();
  const senha = document.getElementById('senha').value;
  if (!login || !senha) { erro.textContent = 'Informe usuário e senha.'; erro.hidden = false; return; }
  botao.disabled = true;
  try {
    const u = await api('/api/login', { dados: { login, senha } });
    location.href = destino(u.papel);
  } catch (err) {
    erro.textContent = err.message; erro.hidden = false;
    document.getElementById('senha').value = '';
    document.getElementById('senha').focus();
  } finally { botao.disabled = false; }
});
</script>
</body>
</html>
